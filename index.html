<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
     <!-- Tailwind-Css -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

     <!-- Google-font -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

       <style>
        * {
            font-family: "Manrope", sans-serif;
        }
       </style>

      <!-- Font-Awesome-cdn-icon -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Banner Section -->
    <section class="flex justify-between border border-red-500 container mx-auto">
         <div class="banner-left space-y-[30px]">
            <h2 class="text-[80px] text-[#1C1C1C] font-extrabold">It's good<br>tea time at The<br>Tea House</h2>
            <p class="text-[18px] text-[#777777] font-medium">Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your Taste Buds.</p>
            <button class="text-[20px] text-white font-bold rounded-[10px] px-5 py-[18px] bg-linear-to-r from-[#FF8938] to-[#FF0000]">Explore More
            <span class="inline-block ml-2.5 -rotate-45">
                <i class="fa-solid fa-arrow-right"></i></span></button>
         </div>
         <div class="banner-Right border border-red-600">
            <img src="./images/banner.png" alt="">
            <div class="w-[255px] bg-[#FFFFFF] rounded[10px] shadow-[]">

            </div>
         </div>
    </section>

</body>
</html>
